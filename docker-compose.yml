services:
  db:
    image: postgres:16-alpine
    container_name: despacho-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: despacho
    ports:
      - "5432:5432"
    volumes:
      - despacho_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d despacho"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: despacho-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/despacho
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    profiles: ["full"]

volumes:
  despacho_db_data:
